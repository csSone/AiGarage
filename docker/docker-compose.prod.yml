services:
  frontend-builder:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../web:/app
      - ../nginx/dist:/app/dist
    command: sh -c "npm install && npm run build"
    container_name: aigarage-frontend-builder

  nginx:
    volumes:
      - ../nginx/conf.d/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ../nginx/dist:/usr/share/nginx/html/dist:ro
