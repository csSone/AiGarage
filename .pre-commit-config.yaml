# Pre-commit hooks configuration for AiGarage project
# See https://pre-commit.com for more information

repos:
  # Frontend hooks - ESLint for TypeScript and Vue files
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: ESLint for frontend
        files: ^(web/.*\.(ts|tsx|vue|js|jsx))$
        args: [--fix]
        additional_dependencies:
          - eslint
          - eslint-plugin-vue
          - @typescript-eslint/eslint-plugin
          - @typescript-eslint/parser

  # Python hooks - Black code formatter
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        name: Black formatter for Python
        files: ^(model_server/.*\.py)$
        language_version: python3.10

  # Python hooks - isort import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.0
    hooks:
      - id: isort
        name: isort import sorter
        files: ^(model_server/.*\.py)$
        args: ["--profile", "black"]

  # Python hooks - flake8 linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: flake8 linter
        files: ^(model_server/.*\.py)$
        args:
          - --max-line-length=88
          - --extend-ignore=E203,W503,E501

  # Go hooks - golangci-lint
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.55.2
    hooks:
      - id: golangci-lint
        name: golangci-lint
        files: ^(backend/.*\.go)$
        args: [--config=backend/.golangci.yml]

  # Go hooks - go fmt
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: go fmt
        files: ^(backend/.*\.go)$

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
        name: Check JSON files
      - id: check-yaml
        name: Check YAML files
      - id: check-toml
        name: Check TOML files
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']
      - id: check-ast
        name: Check Python AST
        files: ^(model_server/.*\.py)$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Markdown lint
        files: \.(md|markdown)$
        args: [--fix]
        exclude: ^(node_modules/|web/node_modules/)

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
